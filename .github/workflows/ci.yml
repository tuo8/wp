name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydrive
          POSTGRES_USER: mydrive
          POSTGRES_PASSWORD: mydrive_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mydrive -d mydrive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PostgreSQL driver
        run: python -c "import psycopg2"
      - name: Compile Python modules
        run: python -m compileall -q mydrive
      - name: Security regression tests
        working-directory: mydrive
        run: python -m unittest -v security_regression_test
      - name: ImgBed storage adapter tests
        working-directory: mydrive
        run: python -m unittest -v imgbed_backend_test
      - name: PostgreSQL integration smoke tests
        working-directory: mydrive
        env:
          DATABASE_URL: postgresql://mydrive:mydrive_test_password@localhost:5432/mydrive
          MYDRIVE_ENV: development
          MYDRIVE_SECRET: postgres-smoke-test-secret-which-is-long-enough
        run: python -m unittest -v postgres_smoke_test
      - name: Validate production Compose configuration
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config --quiet
          rm deploy/.env.production
      - name: Build production container image
        run: docker build --build-arg PYTHON_BASE_IMAGE=python:3.11-slim-bookworm -t mydrive-ci:test .
