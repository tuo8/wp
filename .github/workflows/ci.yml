name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PostgreSQL driver
        run: python -c "import psycopg2"
      - name: Compile Python modules
        run: python -m compileall -q mydrive
      - name: Security regression tests
        working-directory: mydrive
        run: python -m unittest -v security_regression_test
