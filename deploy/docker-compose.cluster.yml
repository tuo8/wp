version: "3.9"

# EXPERIMENTAL ONLY: not production-certified while some modules still use direct SQLite connections.
# Do not scale API replicas until the database audit and multi-node consistency tests are complete.

x-api-env: &api-env
  MYDRIVE_ENV: production
  MYDRIVE_AUTH_REQUIRED: "1"
  MYDRIVE_SMS_DEBUG: "0"
  MYDRIVE_SECRET: ${MYDRIVE_SECRET:?Set MYDRIVE_SECRET}
  MYDRIVE_PRESIGN_SECRET: ${MYDRIVE_PRESIGN_SECRET:?Set MYDRIVE_PRESIGN_SECRET}
  ARIA2_SECRET: ${ARIA2_SECRET:?Set ARIA2_SECRET}
  STORAGE_ROOT: /data/storage
  DATABASE_URL: postgresql://mydrive:${POSTGRES_PASSWORD_URLENCODED:?Set URL-encoded POSTGRES_PASSWORD_URLENCODED}@postgres:5432/mydrive
  REDIS_URL: redis://redis:6379/0
  ARIA2_EXE: /usr/bin/aria2c
  OFFLINE_AUTO_CLEANUP: "1"
  COLD_STORAGE_TYPE: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: mydrive-cold
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  S3_REGION: us-east-1
  LOCAL_CACHE_MAX_BYTES: "2147483648"
  AUTO_OFFLOAD_COLD: "0"
  SLICES_PUBLIC_URL: ${SLICES_PUBLIC_URL:?Set SLICES_PUBLIC_URL}
  ADMIN_USERS: ${ADMIN_USERS:?Set ADMIN_USERS}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10737418240}
  UPLOAD_TEMP_DIR: /data/storage/tmp_uploads

services:
  nginx-lb:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a reviewed pinned image}
    container_name: mydrive-lb
    volumes:
      - ./nginx-cluster.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:80:80"
    depends_on:
      - mydrive-api-1
      - mydrive-api-2
    restart: unless-stopped

  mydrive-api-1:
    image: mydrive-api:${MYDRIVE_IMAGE_TAG:-cluster}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Set PYTHON_BASE_IMAGE to a reviewed pinned image}
    container_name: mydrive-api-1
    volumes:
      - mydrive_shared_data:/data/storage
    environment:
      <<: *api-env
      INSTANCE_ID: api-node-1
      SFTP_ENABLE: "1"
      SFTP_BIND: 0.0.0.0
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:2022:2022"
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  mydrive-api-2:
    image: mydrive-api:${MYDRIVE_IMAGE_TAG:-cluster}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Set PYTHON_BASE_IMAGE to a reviewed pinned image}
    container_name: mydrive-api-2
    volumes:
      - mydrive_shared_data:/data/storage
    environment:
      <<: *api-env
      INSTANCE_ID: api-node-2
      SFTP_ENABLE: "0"
      SLICES_ENABLE: "0"
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a reviewed pinned image}
    container_name: mydrive-postgres
    environment:
      POSTGRES_USER: mydrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mydrive
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    expose:
      - "5432"
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a reviewed pinned image}
    container_name: mydrive-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a reviewed pinned image}
    container_name: mydrive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:?Set MINIO_MC_IMAGE to a reviewed pinned image}
    container_name: mydrive-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
      mc mb --ignore-existing local/mydrive-cold

volumes:
  mydrive_shared_data:
  pg_data:
  redis_data:
  minio_data:
